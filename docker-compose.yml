services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: languagetutor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springboot-postgres-net

  backend:
    image: dineshchandu/docker-backend-2400030518:latest
    container_name: docker-springboot
    ports:
      - "2025:8080"
    depends_on:
      postgresdb:
    restart: on-failure
    networks:
      - springboot-postgres-net

  frontend:
    image: dineshchandu/docker-frontend-2400030518:latest
    container_name: docker-react
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - springboot-postgres-net
volumes:
  postgres_data:

networks:
  springboot-postgres-net:
