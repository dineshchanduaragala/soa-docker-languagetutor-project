
name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.LANGUAGETUTOR_USERNAME }}
          password: ${{ secrets.LANGUAGETUTOR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./LanguageTutorFrontend
          file: ./LanguageTutorFrontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.LANGUAGETUTOR_USERNAME }}/docker-frontend-languagetutor:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./LanguageTutorBackend
          file: ./LanguageTutorBackend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.LANGUAGETUTOR_USERNAME }}/docker-backend-languagetutor:latest
